services:
  api-docs:
    image: docker.swagger.io/swaggerapi/swagger-ui:latest
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SWAGGER_JSON_URL: /docs/openapi.yaml
    volumes:
      - type: bind
        source: ./yaml
        target: /usr/share/nginx/html/docs
        read_only: true
