          minLength: 1
        licenseNumber:
          type: string
          minLength: 1
        documentIds:
          type: array
          items:
            type: string
            description: Mã định danh do server cấp.
            example: trip_001
      required:
      - identityNumber
      - licenseNumber
      - documentIds
    DriverProfile:
