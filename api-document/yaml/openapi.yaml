openapi: 3.0.3
info:
  title: CAB System API
  version: 0.1.0
servers:
- url: http://localhost:8080/api/v1
  description: Địa chỉ backend dự kiến; thay khi triển khai.
security:
- bearerAuth: []
tags:
- name: Auth
  description: Đăng ký, OTP, đăng nhập và phiên
- name: Accounts
  description: Tài khoản và tài liệu riêng tư
- name: Drivers
  description: Hồ sơ, xe, sẵn sàng, GPS
- name: Booking
  description: Địa chỉ, lộ trình, loại xe, báo giá
- name: Trips
  description: Đặt và theo dõi chuyến
- name: Dispatch
  description: Nhận/từ chối lời mời
- name: Payments
  description: Cước, thanh toán, lịch sử và hoàn tiền
- name: Integrations
  description: Callback của adapter mô phỏng
- name: Ratings
  description: Đánh giá chất lượng
- name: Notifications
  description: Thông báo và thiết bị
- name: Administration
  description: Quản lý tài khoản và phương tiện
- name: Operations
  description: Giám sát, sự cố và phê duyệt
- name: Reports
  description: Báo cáo, xuất Excel/PDF
- name: Security
  description: Quyền và audit
x-readme-business-rules:
  BR-01: Bearer và kiểm tra quyền mọi thao tác nghiệp vụ
  BR-02: createTrip tự ưu tiên GPS/AVAILABLE/hiệu quả
  BR-03: rejectOffer/timeout chuyển tiếp trên cùng tripId
  BR-04: CANCELLED + NO_DRIVER_AVAILABLE và thông báo
  BR-05: COMPLETED tự chốt cước server
  BR-06: Không nhận/lưu PAN, CVV, tài khoản ngân hàng
  BR-07: FAILED cho thử lại; PENDING phải đối soát
  BR-08: status-transitions kiểm soát thứ tự và phiên bản
  BR-09: Quyền riêng từng action, hàng đợi phê duyệt
  BR-10: Audit tự động, API chỉ đọc
  BR-11: Giới hạn đối tượng, HTTPS, che dữ liệu nhạy cảm
paths:
  /auth/registrations:
    post:
      tags:
      - Auth
      summary: Đăng ký và gửi OTP
      operationId: register
      description: Tạo hồ sơ đăng ký tạm, kiểm tra trùng SĐT/email. Tài khoản chỉ được kích hoạt sau OTP. DRIVER
        gửi thông tin CCCD, bằng lái, xe; documentIds có thể rỗng lúc đăng ký, bổ sung giấy tờ sau xác minh. Hồ
        sơ chưa duyệt không được nhận chuyến. SMS/email dùng bộ mô phỏng trong đồ án, không SMS Brandname.
      responses:
        '202':
          description: Đã tiếp nhận; truy vấn tài nguyên trả về để theo dõi kết quả.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles: []
      x-readme-fr:
      - FR01.1
      - FR01.4
      - FR10.1
      x-readme-use-cases:
      - UC002
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
  /auth/registrations/verify:
    post:
      tags:
      - Auth
      summary: Xác minh OTP và tạo tài khoản
      operationId: verifyRegistration
      description: OTP sai/hết hạn trả 422 OTP_INVALID_OR_EXPIRED. OTP chỉ dùng một lần. Xác minh duy nhất SĐT/email
        một lần nữa trước khi tạo.
      responses:
        '201':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles: []
      x-readme-fr:
      - FR01.1
      - FR10.1
      x-readme-use-cases:
      - UC002
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
  /auth/registrations/resend-otp:
    post:
      tags:
      - Auth
      summary: Gửi lại OTP
      operationId: resendOtp
      description: Vô hiệu mã cũ; giới hạn gửi và lần thử theo cấu hình chưa chốt. Không trả OTP trong response.
      responses:
        '202':
          description: Đã tiếp nhận; truy vấn tài nguyên trả về để theo dõi kết quả.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-roles: []
      x-readme-fr: []
      x-readme-use-cases:
      - UC002
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtp'
  /auth/invitations/activate:
    post:
      tags:
      - Auth
      summary: Kích hoạt tài khoản do vận hành tạo
      operationId: activateInvitation
      description: Xác minh OTP và đặt mật khẩu của chính người dùng; áp dụng quy tắc hồ sơ tài xế như đăng ký công
        khai. Thiết kế hỗ trợ UC013.
      responses:
        '201':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles: []
      x-readme-fr: []
      x-readme-use-cases:
      - UC013
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationActivate'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Đăng nhập bằng SĐT/email và mật khẩu
      operationId: login
      description: Sai tài khoản/mật khẩu trả 401 INVALID_CREDENTIALS; tài khoản khóa trả 403 ACCOUNT_LOCKED. Token
        không chứa quyền do client tự khai báo.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles: []
      x-readme-fr:
      - FR01.2
      - FR10.1
      x-readme-use-cases:
      - UC001
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Đăng xuất
      operationId: logout
      description: Thu hồi phiên hiện tại trên server.
      responses:
        '204':
          description: Xử lý thành công.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr:
      - FR10.1
      x-readme-use-cases: []
  /users/me:
    get:
      tags:
      - Accounts
      summary: Xem hồ sơ cá nhân
      operationId: getMe
      description: Chỉ dữ liệu của người gọi.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr:
      - FR01.3
      x-readme-use-cases: []
    patch:
      tags:
      - Accounts
      summary: Cập nhật thông tin cá nhân
      operationId: updateMe
      description: Không được sửa role/status. Email phải duy nhất. Việc đổi thông tin xác thực cần quy trình xác
        minh riêng trước triển khai; endpoint này chỉ đổi email liên hệ, không đổi định danh đăng nhập.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr:
      - FR01.3
      x-readme-use-cases: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
  /documents:
    post:
      tags:
      - Accounts
      summary: Tải giấy tờ hồ sơ/xe
      operationId: uploadDocument
      description: Chủ hồ sơ tải giấy tờ; chỉ nhận JPEG/PNG/PDF, kiểm tra nội dung tệp. Giới hạn dung lượng cần
        cấu hình. ID tài liệu phải thuộc người dùng khi gắn vào hồ sơ. Không trả URL công khai.
      responses:
        '201':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
      - CUSTOMER
      - DRIVER
      - OPERATOR
      x-readme-fr:
      - FR01.4
      - FR01.5
      - FR08.3
      x-readme-use-cases: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum:
                  - IDENTITY
                  - DRIVING_LICENSE
                  - VEHICLE_REGISTRATION
              required:
              - file
              - kind
  /documents/{documentId}:
    get:
      tags:
      - Accounts
      summary: Đọc giấy tờ được cấp quyền
      operationId: downloadDocument
      description: Chỉ chủ tài liệu hoặc nhân viên có quyền documents:read. Kiểm tra quyền từng tài liệu; không
        cung cấp đường dẫn lưu trữ nội bộ.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
      - DRIVER
      - OPERATOR
      - ADMIN
      x-readme-fr:
      - FR01.4
      - FR08.2
      - FR08.3
      x-readme-use-cases: []
      parameters:
      - name: documentId
        in: path
        required: true
        description: Mã định danh documentId
        schema:
          type: string
          minLength: 1
        example: document_001
  /drivers/me/profile:
    get:
      tags:
      - Drivers
      summary: Xem hồ sơ tài xế
      operationId: getDriverProfile
      description: Chỉ tài xế sở hữu. Thay đổi giấy tờ đưa hồ sơ về PENDING để duyệt lại. Dữ liệu nhạy cảm không
        xuất hiện trong thông tin tài xế công khai.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR01.4
      x-readme-use-cases: []
    put:
      tags:
      - Drivers
      summary: Cập nhật hồ sơ tài xế
      operationId: putDriverProfile
      description: Chỉ tài xế sở hữu. Thay đổi giấy tờ đưa hồ sơ về PENDING để duyệt lại. Dữ liệu nhạy cảm không
        xuất hiện trong thông tin tài xế công khai.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR01.4
      x-readme-use-cases: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfileInput'
  /drivers/me/vehicle:
    get:
      tags:
      - Drivers
      summary: Xem phương tiện của tôi
      operationId: getDriverVehicle
      description: Thiết kế mỗi tài xế một xe hoạt động. PUT tạo hoặc thay thế thông tin, biển số duy nhất; đổi
        xe/giấy tờ cần duyệt lại. Không đổi phương tiện khi đang thực hiện chuyến.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR01.5
      x-readme-use-cases: []
    put:
      tags:
      - Drivers
      summary: Đăng ký/cập nhật phương tiện
      operationId: putDriverVehicle
      description: Thiết kế mỗi tài xế một xe hoạt động. PUT tạo hoặc thay thế thông tin, biển số duy nhất; đổi
        xe/giấy tờ cần duyệt lại. Không đổi phương tiện khi đang thực hiện chuyến.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR01.5
      x-readme-use-cases: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleInput'
  /drivers/me/availability:
    put:
      tags:
      - Drivers
      summary: Bật/tắt nhận cuốc
      operationId: setAvailability
      description: Chỉ hồ sơ và xe APPROVED mới bật AVAILABLE. BUSY do server quản lý; đang phục vụ chuyến không
        được tự giải phóng trạng thái.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR03.1
      - FR08.6
      x-readme-use-cases: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityInput'
  /drivers/me/locations:
    post:
      tags:
      - Drivers
      summary: Cập nhật vị trí GPS
      operationId: recordLocation
      description: Lưu dấu vết theo recordedAt/sequence; mẫu cũ không ghi đè vị trí mới nhất. Server gắn vị trí
        vào chuyến đang được phân công. Không nhận driverId tùy ý.
      responses:
        '204':
          description: Xử lý thành công.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR03.1
      - FR03.2
      - FR04.7
      x-readme-use-cases: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
  /vehicle-types:
    get:
      tags:
      - Booking
      summary: Danh sách loại xe
      operationId: listVehicleTypes
      description: Ba loại xe của UC003; khả dụng theo khu vực.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleServicePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-required-roles:
