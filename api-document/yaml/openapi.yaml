components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token do /auth/login cấp; không giả định JWT.
    paymentSignature:
      type: apiKey
      in: header
      name: X-Payment-Signature
      description: Chữ ký của adapter thanh toán trên raw body và X-Payment-Timestamp; chỉ khai báo header không
        thay thế kiểm tra mật mã.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa duy nhất cho một thao tác logic, phạm vi người gọi + method + path. Retry cùng key và body
        trả lại kết quả gốc kể cả phiên bản đã tăng; cùng key khác body trả 409 IDEMPOTENCY_CONFLICT. Server phải
        lưu kết quả nguyên tử với thay đổi nghiệp vụ. Thời hạn lưu khóa cần chốt trước triển khai.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: cab-request-0001
  schemas:
    VehicleType:
      type: string
      enum:
      - MOTORBIKE
      - CAR_4
      - CAR_7
    PaymentMethod:
      type: string
      enum:
      - CASH
      - BANK_CARD
      - E_WALLET
    TripStatus:
      type: string
      enum:
      - SEARCHING
      - DRIVER_ASSIGNED
      - ARRIVED
      - PICKED_UP
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
    PaymentStatus:
      type: string
      enum:
      - UNPAID
      - PENDING
      - PAID
      - FAILED
      - PARTIALLY_REFUNDED
      - REFUNDED
    Error:
      type: object
      properties:
        code:
          type: string
          description: Mã lỗi máy đọc được.
          example: INVALID_TRIP_STATE
        message:
          type: string
          example: Trạng thái chuyến không cho phép thao tác.
        requestId:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - code
      - message
      - requestId
    Point:
      type: object
      properties:
        latitude:
          type: number
          description: Vĩ độ.
          minimum: -90
          maximum: 90
          example: 10.822
        longitude:
          type: number
          description: Kinh độ.
          minimum: -180
          maximum: 180
          example: 106.688
        address:
          type: string
          description: Địa chỉ hiển thị.
          example: 12 Nguyễn Văn Bảo, TP. Hồ Chí Minh
      required:
      - latitude
      - longitude
    Location:
      type: object
      properties:
        point:
          $ref: '#/components/schemas/Point'
        recordedAt:
          type: string
          description: Thời gian RFC 3339, lưu UTC.
          format: date-time
          example: '2026-09-07T03:00:00Z'
        accuracyMeters:
          type: number
          description: Sai số GPS, mét.
          minimum: 0
        sequence:
          type: integer
          description: Số thứ tự tăng trên thiết bị.
          minimum: 0
      required:
      - point
      - recordedAt
      - sequence
    User:
      type: object
      properties:
        id:
          type: string
          description: Mã định danh do server cấp.
          example: trip_001
        fullName:
          type: string
          example: Nguyễn Văn An
        phone:
          type: string
          example: '+84901234567'
        email:
          type: string
          format: email
          example: an@example.com
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - OPERATOR
          - MANAGER
          - ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - LOCKED
        createdAt:
          type: string
          description: Thời gian RFC 3339, lưu UTC.
          format: date-time
          example: '2026-09-07T03:00:00Z'
      required:
      - id
      - fullName
      - phone
      - email
      - role
      - status
      - createdAt
    ProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    VehicleInput:
      type: object
      properties:
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        plateNumber:
          type: string
          minLength: 1
          example: 59A-12345
        brand:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        color:
          type: string
          minLength: 1
        documentIds:
          type: array
