        id:
          type: string
          description: Mã định danh do server cấp.
          example: trip_001
        driverId:
          type: string
          description: Mã định danh do server cấp.
          example: trip_001
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        plateNumber:
          type: string
          minLength: 1
          example: 59A-12345
        brand:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        color:
          type: string
          minLength: 1
        documentIds:
          type: array
          items:
            type: string
            description: Mã định danh do server cấp.
            example: trip_001
        reviewStatus:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        reviewReason:
          type: string
        active:
          type: boolean
      required:
