  responses:
    BadRequest:
      description: Dữ liệu sai định dạng hoặc thiếu trường.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Dữ liệu sai định dạng hoặc thiếu trường.
            requestId: req_001
    Unauthorized:
      description: Chưa xác thực hoặc thông tin xác thực hết hạn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Chưa xác thực hoặc thông tin xác thực hết hạn.
            requestId: req_001
    Forbidden:
      description: Không đủ quyền, sai chủ sở hữu hoặc tài khoản bị khóa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Không đủ quyền, sai chủ sở hữu hoặc tài khoản bị khóa.
            requestId: req_001
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Không tìm thấy tài nguyên.
            requestId: req_001
    Conflict:
      description: Xung đột trạng thái, phiên bản, dữ liệu trùng hoặc thao tác đã xử lý.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CONFLICT
            message: Xung đột trạng thái, phiên bản, dữ liệu trùng hoặc thao tác đã xử lý.
            requestId: req_001
    Unprocessable:
      description: Dữ liệu đúng định dạng nhưng vi phạm điều kiện nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BUSINESS_RULE_VIOLATION
            message: Dữ liệu đúng định dạng nhưng vi phạm điều kiện nghiệp vụ.
            requestId: req_001
    TooManyRequests:
      description: Vượt giới hạn yêu cầu/OTP. Thử lại theo Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: Vượt giới hạn yêu cầu/OTP. Thử lại theo Retry-After.
            requestId: req_001
      headers:
        Retry-After:
          description: Thời gian chờ tính bằng giây.
          schema:
            type: integer
            description: ''
            minimum: 1
    ServerError:
      description: Lỗi nội bộ; sử dụng requestId khi liên hệ hỗ trợ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Lỗi nội bộ; sử dụng requestId khi liên hệ hỗ trợ.
            requestId: req_001
    Unavailable:
      description: Dịch vụ phụ thuộc tạm không khả dụng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SERVICE_UNAVAILABLE
            message: Dịch vụ phụ thuộc tạm không khả dụng.
            requestId: req_001
