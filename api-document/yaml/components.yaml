securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    description: Access token do /auth/login cấp; không giả định JWT.
  paymentSignature:
    type: apiKey
    in: header
    name: X-Payment-Signature
    description: Chữ ký của adapter thanh toán trên raw body và X-Payment-Timestamp; chỉ khai báo header không thay
      thế kiểm tra mật mã.
parameters:
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: true
    description: Khóa duy nhất cho một thao tác logic, phạm vi người gọi + method + path. Retry cùng key và body
      trả lại kết quả gốc kể cả phiên bản đã tăng; cùng key khác body trả 409 IDEMPOTENCY_CONFLICT. Server phải
      lưu kết quả nguyên tử với thay đổi nghiệp vụ. Thời hạn lưu khóa cần chốt trước triển khai.
    schema:
      type: string
      minLength: 1
      maxLength: 128
    example: cab-request-0001
schemas:
  VehicleType:
    type: string
    enum:
    - MOTORBIKE
    - CAR_4
    - CAR_7
  PaymentMethod:
    type: string
    enum:
    - CASH
    - BANK_CARD
    - E_WALLET
  TripStatus:
    type: string
    enum:
    - SEARCHING
    - DRIVER_ASSIGNED
    - ARRIVED
    - PICKED_UP
    - IN_PROGRESS
    - COMPLETED
    - CANCELLED
  PaymentStatus:
    type: string
    enum:
    - UNPAID
    - PENDING
    - PAID
    - FAILED
    - PARTIALLY_REFUNDED
    - REFUNDED
  Error:
    type: object
    properties:
      code:
        type: string
        description: Mã lỗi máy đọc được.
        example: INVALID_TRIP_STATE
      message:
        type: string
        example: Trạng thái chuyến không cho phép thao tác.
      requestId:
        type: string
      details:
        type: array
        items:
          type: object
          properties:
            field:
              type: string
            message:
              type: string
          required:
          - field
          - message
    required:
    - code
    - message
    - requestId
  Point:
    type: object
    properties:
      latitude:
        type: number
        description: Vĩ độ.
        minimum: -90
        maximum: 90
        example: 10.822
      longitude:
        type: number
        description: Kinh độ.
        minimum: -180
        maximum: 180
        example: 106.688
      address:
        type: string
        description: Địa chỉ hiển thị.
        example: 12 Nguyễn Văn Bảo, TP. Hồ Chí Minh
    required:
    - latitude
    - longitude
  Location:
    type: object
    properties:
      point:
        $ref: '#/schemas/Point'
      recordedAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      accuracyMeters:
        type: number
        description: Sai số GPS, mét.
        minimum: 0
      sequence:
        type: integer
        description: Số thứ tự tăng trên thiết bị.
        minimum: 0
    required:
    - point
    - recordedAt
    - sequence
  User:
    type: object
    properties:
      id:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      fullName:
        type: string
        example: Nguyễn Văn An
      phone:
        type: string
        example: '+84901234567'
      email:
        type: string
        format: email
        example: an@example.com
      role:
        type: string
        enum:
        - CUSTOMER
        - DRIVER
        - OPERATOR
        - MANAGER
        - ADMIN
      status:
        type: string
        enum:
        - ACTIVE
        - LOCKED
      createdAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
    required:
    - id
    - fullName
    - phone
    - email
    - role
    - status
    - createdAt
  ProfileUpdate:
    type: object
    properties:
      fullName:
        type: string
        minLength: 1
      email:
        type: string
        format: email
  VehicleInput:
    type: object
    properties:
      vehicleType:
        $ref: '#/schemas/VehicleType'
      plateNumber:
        type: string
        minLength: 1
        example: 59A-12345
      brand:
        type: string
        minLength: 1
      model:
        type: string
        minLength: 1
      color:
        type: string
        minLength: 1
      documentIds:
        type: array
        items:
          type: string
          description: Mã định danh do server cấp.
          example: trip_001
    required:
    - vehicleType
    - plateNumber
    - brand
    - model
    - color
    - documentIds
  Vehicle:
    type: object
    properties:
      id:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      driverId:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      vehicleType:
        $ref: '#/schemas/VehicleType'
      plateNumber:
        type: string
        minLength: 1
        example: 59A-12345
      brand:
        type: string
        minLength: 1
      model:
        type: string
        minLength: 1
      color:
        type: string
        minLength: 1
      documentIds:
        type: array
        items:
          type: string
          description: Mã định danh do server cấp.
          example: trip_001
      reviewStatus:
        type: string
        enum:
        - PENDING
        - APPROVED
        - REJECTED
      reviewReason:
        type: string
      active:
        type: boolean
    required:
    - id
    - driverId
    - vehicleType
    - plateNumber
    - reviewStatus
    - active
  DriverProfileInput:
    type: object
    properties:
      identityNumber:
        type: string
        description: CCCD; dữ liệu riêng tư, chỉ chủ hồ sơ và nhân viên có quyền được đọc.
        minLength: 1
      licenseNumber:
        type: string
        minLength: 1
      documentIds:
        type: array
        items:
          type: string
          description: Mã định danh do server cấp.
          example: trip_001
    required:
    - identityNumber
    - licenseNumber
    - documentIds
  DriverProfile:
    type: object
    properties:
      user:
        $ref: '#/schemas/User'
      identityNumber:
        type: string
        description: CCCD; dữ liệu riêng tư, chỉ chủ hồ sơ và nhân viên có quyền được đọc.
        minLength: 1
      licenseNumber:
        type: string
        minLength: 1
      documentIds:
        type: array
        items:
          type: string
          description: Mã định danh do server cấp.
          example: trip_001
      reviewStatus:
        type: string
        enum:
        - PENDING
        - APPROVED
        - REJECTED
      reviewReason:
        type: string
      availability:
        type: string
        enum:
        - OFFLINE
        - AVAILABLE
        - BUSY
      averageRating:
        type: number
        description: ''
        minimum: 1
        maximum: 5
        nullable: true
      vehicle:
        $ref: '#/schemas/Vehicle'
    required:
    - user
    - reviewStatus
    - availability
  Registration:
    type: object
    properties:
      role:
        type: string
        enum:
        - CUSTOMER
        - DRIVER
      fullName:
        type: string
        minLength: 1
      phone:
        type: string
        minLength: 1
      email:
        type: string
        format: email
      password:
        type: string
        description: Chính sách độ dài/độ mạnh cần chốt trước triển khai.
        minLength: 1
        writeOnly: true
      otpChannel:
        type: string
        enum:
        - SMS
        - EMAIL
      driverProfile:
        $ref: '#/schemas/DriverProfileInput'
      vehicle:
        $ref: '#/schemas/VehicleInput'
    required:
    - role
    - fullName
    - phone
    - email
    - password
    - otpChannel
    description: DRIVER bắt buộc có driverProfile và vehicle; CUSTOMER không gửi hai trường này. Không cho tự đăng
      ký vai trò nội bộ.
  OtpChallenge:
    type: object
    properties:
      registrationId:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      expiresAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      resendAvailableAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      maskedDestination:
        type: string
        example: a***@example.com
    required:
    - registrationId
    - expiresAt
    - resendAvailableAt
    - maskedDestination
  OtpVerify:
    type: object
    properties:
      registrationId:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      otp:
        type: string
        description: Mã OTP từ kênh đã chọn; không trả lại mã trong response.
        minLength: 1
        writeOnly: true
    required:
    - registrationId
    - otp
  Login:
    type: object
    properties:
      identifier:
        type: string
        description: Số điện thoại hoặc email.
        example: an@example.com
      password:
        type: string
        writeOnly: true
        minLength: 1
    required:
    - identifier
    - password
  Session:
    type: object
    properties:
      accessToken:
        type: string
      tokenType:
        type: string
        enum:
        - Bearer
      expiresAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      user:
        $ref: '#/schemas/User'
    required:
    - accessToken
    - tokenType
    - expiresAt
    - user
  Document:
    type: object
    properties:
      id:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      fileName:
        type: string
      mediaType:
        type: string
      createdAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
    required:
    - id
    - fileName
    - mediaType
    - createdAt
  RouteRequest:
    type: object
    properties:
      pickup:
        $ref: '#/schemas/Point'
      destination:
        $ref: '#/schemas/Point'
      vehicleType:
        $ref: '#/schemas/VehicleType'
    required:
    - pickup
    - destination
    - vehicleType
  Route:
    type: object
    properties:
      points:
        type: array
        items:
          $ref: '#/schemas/Point'
      distanceMeters:
        type: number
        description: ''
        minimum: 0
      durationSeconds:
        type: integer
        description: ''
        minimum: 0
    required:
    - points
    - distanceMeters
    - durationSeconds
  FareEstimateRequest:
    type: object
    properties:
      pickup:
        $ref: '#/schemas/Point'
      destination:
        $ref: '#/schemas/Point'
      vehicleType:
        $ref: '#/schemas/VehicleType'
    required:
    - pickup
    - destination
    - vehicleType
  FareEstimate:
    type: object
    properties:
      id:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      route:
        $ref: '#/schemas/Route'
      amount:
        type: integer
        description: Số tiền nguyên, đơn vị VND.
        minimum: 0
        example: 65000
      currency:
        type: string
        enum:
        - VND
      expiresAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      pricingNote:
        type: string
        description: Giá dự kiến; giá cuối tính theo hành trình thực tế.
    required:
    - id
    - route
    - amount
    - currency
    - expiresAt
  TripCreate:
    type: object
    properties:
      pickup:
        $ref: '#/schemas/Point'
      destination:
        $ref: '#/schemas/Point'
      vehicleType:
        $ref: '#/schemas/VehicleType'
      paymentMethod:
        $ref: '#/schemas/PaymentMethod'
      estimateId:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      note:
        type: string
        description: Ghi chú đón khách.
    required:
    - pickup
    - destination
    - vehicleType
    - paymentMethod
    - estimateId
  DriverPublic:
    type: object
    properties:
      id:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      fullName:
        type: string
      phone:
        type: string
        description: Chỉ cung cấp cho khách của chuyến đang được phục vụ.
      averageRating:
        type: number
        description: ''
        minimum: 1
        maximum: 5
        nullable: true
      vehicleType:
        $ref: '#/schemas/VehicleType'
      plateNumber:
        type: string
      brand:
        type: string
      color:
        type: string
    required:
    - id
    - fullName
    - vehicleType
    - plateNumber
  Trip:
    type: object
    properties:
      id:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      customerId:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      driver:
        $ref: '#/schemas/DriverPublic'
      pickup:
        $ref: '#/schemas/Point'
      destination:
        $ref: '#/schemas/Point'
      vehicleType:
        $ref: '#/schemas/VehicleType'
      status:
        $ref: '#/schemas/TripStatus'
      paymentStatus:
        $ref: '#/schemas/PaymentStatus'
      paymentMethod:
        $ref: '#/schemas/PaymentMethod'
      estimatedFare:
        type: integer
        description: Số tiền nguyên, đơn vị VND.
        minimum: 0
        example: 65000
      finalFare:
        type: integer
        description: Số tiền nguyên, đơn vị VND.
        minimum: 0
        example: 65000
      currency:
        type: string
        enum:
        - VND
      version:
        type: integer
        description: Phiên bản tăng sau mỗi thay đổi; dùng chống ghi đè khi đồng bộ.
        minimum: 1
        example: 1
      createdAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      assignedAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      arrivedAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      pickedUpAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      startedAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      completedAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      cancelledAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      cancelReason:
        type: string
      cancelCode:
        type: string
        enum:
        - CUSTOMER_CANCELLED
        - DRIVER_CANCELLED
        - NO_DRIVER_AVAILABLE
        - CUSTOMER_NO_SHOW
        - OPERATIONS_CANCELLED
      cancelledBy:
        type: string
        enum:
        - CUSTOMER
        - DRIVER
        - SYSTEM
        - OPERATOR
      ratingDeadline:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      replacementTripId:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
    required:
    - id
    - customerId
    - pickup
    - destination
    - vehicleType
    - status
    - paymentStatus
    - paymentMethod
    - estimatedFare
    - currency
    - version
    - createdAt
  Tracking:
    type: object
    properties:
      trip:
        $ref: '#/schemas/Trip'
      driverLocation:
        $ref: '#/schemas/Location'
      locationStatus:
        type: string
        enum:
        - LIVE
        - STALE
        - UNAVAILABLE
      etaSeconds:
        type: integer
        description: ''
        minimum: 0
        nullable: true
      route:
        $ref: '#/schemas/Route'
      serverTime:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      warnings:
        type: array
        items:
          type: string
    required:
    - trip
    - locationStatus
    - serverTime
    - warnings
  TripEvent:
    type: object
    properties:
      id:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      tripId:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      type:
        type: string
        enum:
        - CREATED
        - OFFERED
        - ASSIGNED
        - ARRIVED
        - PICKED_UP
        - STARTED
        - COMPLETED
        - CANCELLED
        - PAYMENT_UPDATED
        - INCIDENT_UPDATED
      occurredAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      status:
        $ref: '#/schemas/TripStatus'
      description:
        type: string
    required:
    - id
    - tripId
    - type
    - occurredAt
    - description
  Offer:
    type: object
    properties:
      id:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      tripId:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      pickup:
        $ref: '#/schemas/Point'
      destination:
        $ref: '#/schemas/Point'
      vehicleType:
        $ref: '#/schemas/VehicleType'
      estimatedFare:
        type: integer
        description: Số tiền nguyên, đơn vị VND.
        minimum: 0
        example: 65000
      pickupDistanceMeters:
        type: number
        description: ''
        minimum: 0
      expiresAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      status:
        type: string
        enum:
        - PENDING
        - ACCEPTED
        - REJECTED
        - EXPIRED
        - REVOKED
    required:
    - id
    - tripId
    - pickup
    - destination
    - vehicleType
    - expiresAt
    - status
  StatusChange:
    type: object
    properties:
      status:
        type: string
        enum:
        - ARRIVED
        - PICKED_UP
        - IN_PROGRESS
        - COMPLETED
      expectedVersion:
        type: integer
        description: Phiên bản tăng sau mỗi thay đổi; dùng chống ghi đè khi đồng bộ.
        minimum: 1
        example: 1
      location:
        $ref: '#/schemas/Location'
      occurredAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
    required:
    - status
    - expectedVersion
    - location
    - occurredAt
  CancelRequest:
    type: object
    properties:
      reason:
        type: string
        minLength: 1
      expectedVersion:
        type: integer
        description: Phiên bản tăng sau mỗi thay đổi; dùng chống ghi đè khi đồng bộ.
        minimum: 1
        example: 1
      customerNoShow:
        type: boolean
        default: false
    required:
    - reason
    - expectedVersion
  Fare:
    type: object
    properties:
      tripId:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      distanceMeters:
        type: number
        description: ''
        minimum: 0
      durationSeconds:
        type: integer
        description: ''
        minimum: 0
      baseAmount:
        type: integer
        description: Số tiền nguyên, đơn vị VND.
        minimum: 0
        example: 65000
      distanceAmount:
        type: integer
        description: Số tiền nguyên, đơn vị VND.
        minimum: 0
        example: 65000
      otherAmount:
        type: integer
        description: Số tiền nguyên, đơn vị VND.
        minimum: 0
        example: 65000
      discountAmount:
        type: integer
        description: Số tiền nguyên, đơn vị VND.
        minimum: 0
        example: 65000
      totalAmount:
        type: integer
        description: Số tiền nguyên, đơn vị VND.
        minimum: 0
        example: 65000
      currency:
        type: string
        enum:
        - VND
      calculatedAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      pricingRuleVersion:
        type: string
      paymentStatus:
        $ref: '#/schemas/PaymentStatus'
    required:
    - tripId
    - distanceMeters
    - totalAmount
    - currency
    - calculatedAt
    - paymentStatus
  PaymentCreate:
    type: object
    properties:
      method:
        $ref: '#/schemas/PaymentMethod'
    required:
    - method
  Payment:
    type: object
    properties:
      id:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      tripId:
        type: string
        description: Mã định danh do server cấp.
        example: trip_001
      method:
        $ref: '#/schemas/PaymentMethod'
      status:
        type: string
        enum:
        - PENDING
        - SUCCEEDED
        - FAILED
        - CANCELLED
      amount:
        type: integer
        description: Số tiền nguyên, đơn vị VND.
        minimum: 0
        example: 65000
      currency:
        type: string
        enum:
        - VND
      providerReference:
        type: string
      checkoutUrl:
        type: string
        description: URL mô phỏng do server tạo; không chứa thông tin thẻ.
        format: uri
      failureCode:
        type: string
      createdAt:
        type: string
        description: Thời gian RFC 3339, lưu UTC.
        format: date-time
        example: '2026-09-07T03:00:00Z'
      updatedAt:
        type: string
