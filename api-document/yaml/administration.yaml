      summary: Cập nhật phương tiện
      operationId: adminUpdateVehicle
      description: Quyền vehicles:write; không thay đổi xe đang phục vụ chuyến, không đổi chủ qua body. Kiểm tra
        trùng biển số và duyệt lại giấy tờ.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
