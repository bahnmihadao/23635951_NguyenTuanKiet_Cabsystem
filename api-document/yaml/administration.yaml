        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - OPERATOR
      - ADMIN
      x-readme-fr:
      - FR08.2
      - FR08.6
      x-readme-use-cases:
      - UC013
      parameters:
      - name: page
        in: query
        required: false
        description: page
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: pageSize
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
      - name: query
        in: query
        required: false
        description: Tìm theo ID, tên, SĐT; phương tiện hỗ trợ biển số.
        schema:
          type: string
      - name: regionId
        in: query
        required: false
