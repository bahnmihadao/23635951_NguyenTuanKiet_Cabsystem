        schema:
          type: string
      - name: availability
        in: query
        required: false
        description: availability
        schema:
          type: string
          enum:
          - AVAILABLE
          - BUSY
          - OFFLINE
      - name: reviewStatus
        in: query
        required: false
        description: reviewStatus
        schema:
          type: string
          enum:
