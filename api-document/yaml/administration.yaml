    post:
      tags:
      - Administration
      summary: Tạo phương tiện cho tài xế
      operationId: adminCreateVehicle
      description: Quyền vehicles:write; biển số duy nhất, chủ là DRIVER; giấy tờ thuộc hồ sơ được quản lý; audit
        tự động.
      responses:
        '201':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Vehicle
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
