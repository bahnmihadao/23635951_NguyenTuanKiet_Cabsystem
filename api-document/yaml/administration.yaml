openapi: 3.0.3
info:
  title: CAB System API - Administration, Operations & Reports
  version: 0.1.0
servers:
- url: http://localhost:8080/api/v1
  description: Địa chỉ backend dự kiến; thay khi triển khai.
security:
- bearerAuth: []
tags:
- name: Administration
  description: Quản lý tài khoản và phương tiện
- name: Operations
  description: Giám sát, sự cố và phê duyệt
- name: Reports
  description: Báo cáo, xuất Excel/PDF
- name: Security
  description: Quyền và audit
paths:
  /trips/{tripId}/incidents:
    post:
      tags:
      - Operations
      summary: Báo sự cố hoặc tranh chấp
      operationId: reportIncident
      description: Khách/tài xế liên quan chuyến tạo yêu cầu hỗ trợ; không được tự sửa doanh thu hoặc kết quả thanh
        toán.
      responses:
        '201':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Incident
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      - DRIVER
      x-readme-fr:
      - FR08.7
      x-readme-use-cases:
      - UC015
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã định danh tripId
        schema:
          type: string
          minLength: 1
        example: trip_001
      - $ref: ./components.yaml#/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/IncidentInput
  /admin/users:
    get:
      tags:
      - Administration
      summary: Tra cứu users
      operationId: adminListUsers
      description: Yêu cầu quyền users:read; lọc và phân trang trên toàn hệ thống. Dữ liệu cá nhân chỉ cho nhân
        viên có quyền nghiệp vụ tương ứng.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/UserPage
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - OPERATOR
      - ADMIN
      x-readme-fr:
      - FR08.1
      x-readme-use-cases:
      - UC013
      parameters:
      - name: page
        in: query
        required: false
        description: page
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: pageSize
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
      - name: query
        in: query
        required: false
        description: Tìm theo ID, tên, SĐT; phương tiện hỗ trợ biển số.
        schema:
          type: string
      - name: regionId
        in: query
        required: false
        description: regionId
        schema:
          type: string
      - name: role
        in: query
        required: false
        description: role
        schema:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
      - name: status
        in: query
        required: false
        description: status
        schema:
          type: string
          enum:
          - ACTIVE
          - LOCKED
      - name: plateNumber
        in: query
        required: false
        description: plateNumber
        schema:
          type: string
    post:
      tags:
      - Administration
      summary: Vận hành tạo tài khoản khách/tài xế
      operationId: adminCreateUser
      description: Quyền users:write. Tạo lời mời, OTP gửi người dùng; DRIVER phải có hồ sơ và xe. Ghi audit. Không
        cho tạo ADMIN qua API này.
      responses:
        '202':
          description: Đã tiếp nhận; truy vấn tài nguyên trả về để theo dõi kết quả.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/OtpChallenge
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - OPERATOR
      - ADMIN
      x-readme-fr:
      - FR08.1
      - FR08.2
      x-readme-use-cases:
      - UC013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/AdminUserCreate
  /admin/users/{userId}:
    get:
      tags:
      - Administration
      summary: Chi tiết user
      operationId: adminGetUsers
      description: Yêu cầu quyền users:read; truy cập thông tin nhạy cảm được kiểm soát.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/User
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - OPERATOR
      - ADMIN
      x-readme-fr:
      - FR08.1
      x-readme-use-cases:
      - UC013
      parameters:
      - name: userId
        in: path
        required: true
        description: Mã định danh userId
        schema:
          type: string
          minLength: 1
        example: user_001
    patch:
      tags:
      - Administration
      summary: Cập nhật thông tin tài khoản
      operationId: adminUpdateUser
      description: Quyền users:write; chỉ khách/tài xế, không đổi role/status qua body; kiểm tra email duy nhất
        và lưu audit.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/User
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - OPERATOR
      - ADMIN
      x-readme-fr:
      - FR08.1
      - FR08.2
      x-readme-use-cases:
      - UC013
      parameters:
      - name: userId
        in: path
        required: true
        description: Mã định danh userId
        schema:
          type: string
          minLength: 1
        example: user_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/ProfileUpdate
