    "summary": "Đọc giấy tờ được cấp quyền"
    "operationId": "downloadDocument"
    "description": "Chỉ chủ tài liệu hoặc nhân viên có quyền documents:read. Kiểm tra quyền từng tài liệu; không cung cấp đường dẫn lưu trữ nội bộ."
    "responses":
      "200":
        "description": "Xử lý thành công."
        "content":
          "application/pdf":
            "schema":
              "type": "string"
              "format": "binary"
          "image/jpeg":
            "schema":
              "type": "string"
              "format": "binary"
          "image/png":
            "schema":
              "type": "string"
              "format": "binary"
      "400":
        "$ref": "./openapi.yaml#/components/responses/BadRequest"
      "401":
        "$ref": "./openapi.yaml#/components/responses/Unauthorized"
      "403":
        "$ref": "./openapi.yaml#/components/responses/Forbidden"
      "404":
        "$ref": "./openapi.yaml#/components/responses/NotFound"
      "429":
        "$ref": "./openapi.yaml#/components/responses/TooManyRequests"
      "500":
        "$ref": "./openapi.yaml#/components/responses/ServerError"
