"/auth/registrations":
  "post":
    "tags":
      - "Auth"
    "summary": "Đăng ký và gửi OTP"
    "operationId": "register"
    "description": "Tạo hồ sơ đăng ký tạm, kiểm tra trùng SĐT/email. Tài khoản chỉ được kích hoạt sau OTP. DRIVER gửi thông tin CCCD, bằng lái, xe; documentIds có thể rỗng lúc đăng ký, bổ sung giấy tờ sau xác minh. Hồ sơ chưa duyệt không được nhận chuyến. SMS/email dùng bộ mô phỏng trong đồ án, không SMS Brandname."
    "responses":
      "202":
        "description": "Đã tiếp nhận; truy vấn tài nguyên trả về để theo dõi kết quả."
        "content":
          "application/json":
            "schema":
              "$ref": "./openapi.yaml#/components/schemas/OtpChallenge"
      "400":
        "$ref": "./openapi.yaml#/components/responses/BadRequest"
      "409":
        "$ref": "./openapi.yaml#/components/responses/Conflict"
      "422":
        "$ref": "./openapi.yaml#/components/responses/Unprocessable"
      "429":
        "$ref": "./openapi.yaml#/components/responses/TooManyRequests"
      "500":
        "$ref": "./openapi.yaml#/components/responses/ServerError"
      "503":
        "$ref": "./openapi.yaml#/components/responses/Unavailable"
    "x-required-roles": []
    "x-readme-fr":
      - "FR01.1"
      - "FR01.4"
      - "FR10.1"
    "x-readme-use-cases":
      - "UC002"
    "security": []
    "requestBody":
      "required": true
      "content":
        "application/json":
          "schema":
            "$ref": "./openapi.yaml#/components/schemas/Registration"
"/auth/registrations/verify":
  "post":
    "tags":
      - "Auth"
    "summary": "Xác minh OTP và tạo tài khoản"
    "operationId": "verifyRegistration"
    "description": "OTP sai/hết hạn trả 422 OTP_INVALID_OR_EXPIRED. OTP chỉ dùng một lần. Xác minh duy nhất SĐT/email một lần nữa trước khi tạo."
    "responses":
      "201":
        "description": "Xử lý thành công."
        "content":
          "application/json":
            "schema":
              "$ref": "./openapi.yaml#/components/schemas/User"
      "400":
        "$ref": "./openapi.yaml#/components/responses/BadRequest"
      "409":
        "$ref": "./openapi.yaml#/components/responses/Conflict"
      "422":
        "$ref": "./openapi.yaml#/components/responses/Unprocessable"
      "429":
        "$ref": "./openapi.yaml#/components/responses/TooManyRequests"
      "500":
        "$ref": "./openapi.yaml#/components/responses/ServerError"
    "x-required-roles": []
    "x-readme-fr":
      - "FR01.1"
      - "FR10.1"
    "x-readme-use-cases":
      - "UC002"
    "security": []
    "requestBody":
      "required": true
      "content":
        "application/json":
          "schema":
            "$ref": "./openapi.yaml#/components/schemas/OtpVerify"
"/auth/registrations/resend-otp":
  "post":
    "tags":
      - "Auth"
    "summary": "Gửi lại OTP"
    "operationId": "resendOtp"
    "description": "Vô hiệu mã cũ; giới hạn gửi và lần thử theo cấu hình chưa chốt. Không trả OTP trong response."
    "responses":
      "202":
        "description": "Đã tiếp nhận; truy vấn tài nguyên trả về để theo dõi kết quả."
        "content":
          "application/json":
            "schema":
              "$ref": "./openapi.yaml#/components/schemas/OtpChallenge"
      "400":
        "$ref": "./openapi.yaml#/components/responses/BadRequest"
      "409":
        "$ref": "./openapi.yaml#/components/responses/Conflict"
      "422":
        "$ref": "./openapi.yaml#/components/responses/Unprocessable"
      "429":
        "$ref": "./openapi.yaml#/components/responses/TooManyRequests"
      "500":
        "$ref": "./openapi.yaml#/components/responses/ServerError"
      "503":
        "$ref": "./openapi.yaml#/components/responses/Unavailable"
    "x-required-roles": []
    "x-readme-fr": []
    "x-readme-use-cases":
      - "UC002"
    "security": []
    "requestBody":
      "required": true
      "content":
        "application/json":
          "schema":
            "$ref": "./openapi.yaml#/components/schemas/ResendOtp"
