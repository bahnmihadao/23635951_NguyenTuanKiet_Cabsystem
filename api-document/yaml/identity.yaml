"/documents":
  "post":
    "tags":
      - "Accounts"
    "summary": "Tải giấy tờ hồ sơ/xe"
    "operationId": "uploadDocument"
    "description": "Chủ hồ sơ tải giấy tờ; chỉ nhận JPEG/PNG/PDF, kiểm tra nội dung tệp. Giới hạn dung lượng cần cấu hình. ID tài liệu phải thuộc người dùng khi gắn vào hồ sơ. Không trả URL công khai."
    "responses":
      "201":
        "description": "Xử lý thành công."
        "content":
          "application/json":
            "schema":
              "$ref": "./openapi.yaml#/components/schemas/Document"
      "400":
        "$ref": "./openapi.yaml#/components/responses/BadRequest"
      "401":
        "$ref": "./openapi.yaml#/components/responses/Unauthorized"
      "403":
        "$ref": "./openapi.yaml#/components/responses/Forbidden"
      "409":
        "$ref": "./openapi.yaml#/components/responses/Conflict"
      "422":
        "$ref": "./openapi.yaml#/components/responses/Unprocessable"
      "429":
        "$ref": "./openapi.yaml#/components/responses/TooManyRequests"
      "500":
        "$ref": "./openapi.yaml#/components/responses/ServerError"
    "x-required-roles":
      - "CUSTOMER"
      - "DRIVER"
      - "OPERATOR"
    "x-readme-fr":
      - "FR01.4"
      - "FR01.5"
      - "FR08.3"
    "x-readme-use-cases": []
    "requestBody":
      "required": true
      "content":
        "multipart/form-data":
          "schema":
            "type": "object"
            "properties":
              "file":
                "type": "string"
                "format": "binary"
              "kind":
                "type": "string"
                "enum":
                  - "IDENTITY"
                  - "DRIVING_LICENSE"
                  - "VEHICLE_REGISTRATION"
            "required":
              - "file"
              - "kind"
"/documents/{documentId}":
  "get":
    "tags":
