openapi: 3.0.3
info:
  title: CAB System API - Notifications
  version: 0.1.0
servers:
- url: http://localhost:8080/api/v1
  description: Địa chỉ backend dự kiến; thay khi triển khai.
security:
- bearerAuth: []
tags:
- name: Notifications
  description: Thông báo và thiết bị
paths:
  /notifications:
    get:
      tags:
      - Notifications
      summary: Hộp thông báo của tôi
      operationId: listNotifications
      description: 'Thông báo tự sinh theo nghiệp vụ, không có API công khai gửi thông báo tùy ý cho người khác.
        Polling hỗ trợ nhận thay đổi và khi kết nối lại. UC005: lưu hàng đợi để gửi lại khi thiết bị có mạng; offer
        hết hạn không gửi lại lời mời đang hoạt động, tự chuyển tài xế tiếp theo. Gửi kênh chính lỗi thì ghi log
        và dùng kênh dự phòng mô phỏng cho tin quan trọng. Thiết bị xác nhận received/read qua API tương ứng; khi
        mở offer phải đọc lại trạng thái server.'
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/NotificationPage
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr:
      - FR07.1
      - FR07.2
      - FR07.3
      - FR07.4
      - FR07.5
      - FR07.6
      - FR07.7
      x-readme-use-cases:
      - UC005
      parameters:
      - name: page
        in: query
        required: false
        description: page
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: pageSize
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
      - name: unreadOnly
        in: query
        required: false
        description: unreadOnly
        schema:
          type: boolean
          default: false
  /notifications/{notificationId}/read:
    post:
      tags:
      - Notifications
      summary: Đánh dấu đã đọc
      operationId: markNotificationRead
      description: Chỉ thông báo của người gọi; gọi lại vẫn thành công.
      responses:
        '204':
          description: Xử lý thành công.
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr:
      - FR07.7
      x-readme-use-cases:
      - UC005
      parameters:
      - name: notificationId
        in: path
        required: true
        description: Mã định danh notificationId
        schema:
          type: string
          minLength: 1
        example: notification_001
  /devices:
    post:
      tags:
      - Notifications
      summary: Đăng ký thiết bị nhận push
      operationId: registerDevice
      description: Token gắn người gọi, không công khai. Adapter thông báo mô phỏng cho đồ án.
      responses:
        '201':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Device
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr:
      - FR07.1
      - FR07.6
      x-readme-use-cases:
      - UC005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/DeviceInput
  /devices/{deviceId}:
    delete:
      tags:
      - Notifications
      summary: Hủy thiết bị nhận push
      operationId: removeDevice
      description: Chỉ thiết bị của người gọi.
      responses:
        '204':
          description: Xử lý thành công.
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr: []
      x-readme-use-cases: []
      parameters:
      - name: deviceId
        in: path
        required: true
        description: Mã định danh deviceId
        schema:
          type: string
          minLength: 1
        example: device_001
  /notifications/{notificationId}/received:
    post:
      tags:
      - Notifications
      summary: Xác nhận thiết bị đã nhận thông báo
      operationId: acknowledgeNotification
      description: Chỉ thông báo của người gọi. Gọi lại không tạo bản ghi trùng; đánh dấu đã nhận độc lập với đã
        đọc.
      responses:
        '204':
          description: Xử lý thành công.
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr: []
      x-readme-use-cases:
      - UC005
      parameters:
      - name: notificationId
        in: path
        required: true
        description: Mã định danh notificationId
        schema:
          type: string
          minLength: 1
        example: notification_001
