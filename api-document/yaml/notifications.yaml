"/notifications":
  "get":
    "tags":
      - "Notifications"
    "summary": "Hộp thông báo của tôi"
    "operationId": "listNotifications"
    "description": "Thông báo tự sinh theo nghiệp vụ, không có API công khai gửi thông báo tùy ý cho người khác. Polling hỗ trợ nhận thay đổi và khi kết nối lại. UC005: lưu hàng đợi để gửi lại khi thiết bị có mạng; offer hết hạn không gửi lại lời mời đang hoạt động, tự chuyển tài xế tiếp theo. Gửi kênh chính lỗi thì ghi log và dùng kênh dự phòng mô phỏng cho tin quan trọng. Thiết bị xác nhận received/read qua API tương ứng; khi mở offer phải đọc lại trạng thái server."
    "responses":
      "200":
        "description": "Xử lý thành công."
        "content":
          "application/json":
            "schema":
              "$ref": "./openapi.yaml#/components/schemas/NotificationPage"
      "400":
        "$ref": "./openapi.yaml#/components/responses/BadRequest"
      "401":
        "$ref": "./openapi.yaml#/components/responses/Unauthorized"
      "403":
        "$ref": "./openapi.yaml#/components/responses/Forbidden"
      "429":
        "$ref": "./openapi.yaml#/components/responses/TooManyRequests"
      "500":
        "$ref": "./openapi.yaml#/components/responses/ServerError"
    "x-required-roles":
      - "AUTHENTICATED"
    "x-readme-fr":
      - "FR07.1"
      - "FR07.2"
      - "FR07.3"
      - "FR07.4"
      - "FR07.5"
      - "FR07.6"
      - "FR07.7"
    "x-readme-use-cases":
      - "UC005"
    "parameters":
      -
        "name": "page"
        "in": "query"
        "required": false
        "description": "page"
        "schema":
          "type": "integer"
          "description": ""
          "minimum": 1
          "default": 1
      -
        "name": "pageSize"
        "in": "query"
        "required": false
        "description": "pageSize"
        "schema":
          "type": "integer"
          "description": ""
          "minimum": 1
          "maximum": 100
          "default": 20
      -
        "name": "unreadOnly"
        "in": "query"
        "required": false
        "description": "unreadOnly"
        "schema":
          "type": "boolean"
          "default": false
