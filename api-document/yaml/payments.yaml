    "summary": "Tài xế xác nhận đã nhận tiền mặt"
    "operationId": "confirmCash"
    "description": "Chỉ tài xế được phân công, giao dịch CASH/PENDING và cước đã chốt. Server cập nhật SUCCEEDED và paymentStatus=PAID nguyên tử, gửi biên lai hai bên. Chưa xác nhận giữ PENDING, hệ thống gửi CASH_REMINDER; tranh chấp tạo incident. Không nhận số tiền tự khai báo."
