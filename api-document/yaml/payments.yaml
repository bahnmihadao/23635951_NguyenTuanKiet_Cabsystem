"/integrations/payments/callback":
  "post":
    "tags":
      - "Integrations"
    "summary": "Nhận kết quả từ cổng thanh toán mô phỏng"
    "operationId": "paymentCallback"
    "description": "Endpoint server-to-server. Xác minh chữ ký trên raw body và timestamp, chống phát lại bằng eventId. Đối chiếu paymentId, providerReference, amount, currency; sai trả 422 PAYMENT_MISMATCH. Callback trùng hợp lệ trả 204, không thu/ghi doanh thu lần hai; kết quả mâu thuẫn giữ để đối soát, không hạ SUCCEEDED xuống FAILED. Signature algorithm, key rotation và cửa sổ timestamp cần chốt với adapter mô phỏng. Không tin kết quả redirect của trình duyệt."
    "responses":
      "204":
        "description": "Xử lý thành công."
      "400":
        "$ref": "./openapi.yaml#/components/responses/BadRequest"
      "401":
        "$ref": "./openapi.yaml#/components/responses/Unauthorized"
      "403":
        "$ref": "./openapi.yaml#/components/responses/Forbidden"
      "409":
        "$ref": "./openapi.yaml#/components/responses/Conflict"
      "422":
        "$ref": "./openapi.yaml#/components/responses/Unprocessable"
      "429":
        "$ref": "./openapi.yaml#/components/responses/TooManyRequests"
      "500":
        "$ref": "./openapi.yaml#/components/responses/ServerError"
    "x-required-roles":
      - "PAYMENT_PROVIDER"
    "x-readme-fr":
      - "FR06.3"
      - "FR06.4"
      - "FR06.6"
      - "FR07.5"
    "x-readme-use-cases":
      - "UC011"
    "security":
      -
        "paymentSignature": []
    "requestBody":
      "required": true
      "content":
        "application/json":
          "schema":
            "$ref": "./openapi.yaml#/components/schemas/PaymentCallback"
    "parameters":
      -
        "name": "X-Payment-Timestamp"
        "in": "header"
        "required": true
        "schema":
          "type": "string"
          "description": "Thời gian RFC 3339, lưu UTC."
          "format": "date-time"
          "example": "2026-09-07T03:00:00Z"
        "description": "Thời điểm được bảo vệ bởi chữ ký."
