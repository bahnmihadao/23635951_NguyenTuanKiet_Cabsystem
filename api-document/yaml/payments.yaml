openapi: 3.0.3
info:
  title: CAB System API - Payments & Ratings
  version: 0.1.0
servers:
- url: http://localhost:8080/api/v1
  description: Địa chỉ backend dự kiến; thay khi triển khai.
security:
- bearerAuth: []
tags:
- name: Payments
  description: Cước, thanh toán, lịch sử và hoàn tiền
- name: Integrations
  description: Callback của adapter mô phỏng
- name: Ratings
  description: Đánh giá chất lượng
paths:
  /trips/{tripId}/fare:
    get:
      tags:
      - Payments
      summary: Xem cước cuối và hóa đơn
      operationId: getFinalFare
      description: Chỉ người tham gia chuyến. Cước được server tính khi kết thúc hoặc xử lý sự cố, chưa có trả 409
        FARE_NOT_READY. Công thức chi tiết chưa chốt; client không gửi số tiền phải thu.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Fare
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      - DRIVER
      x-readme-fr:
      - FR05.1
      - FR05.2
      x-readme-use-cases:
      - UC010
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã định danh tripId
        schema:
          type: string
          minLength: 1
        example: trip_001
  /trips/{tripId}/payments:
    post:
      tags:
      - Payments
      summary: Khởi tạo thanh toán hoặc thanh toán lại
      operationId: createPayment
      description: Chỉ khách sở hữu; chuyến đã có cước cuối. Lấy số tiền từ hóa đơn server. CASH tạo bản ghi PENDING
        chờ tài xế xác nhận; BANK_CARD/E_WALLET trả checkoutUrl mô phỏng. Chỉ tạo lần thử mới khi lần trước FAILED/CANCELLED;
        PENDING phải đối soát trước, PAID từ chối thu lại. Sau thất bại được đổi sang CASH theo chính sách. Timeout
        cổng giữ PENDING, tự truy vấn đối soát; không coi timeout là thất bại chắc chắn.
      responses:
        '201':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Payment
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
        '503':
          $ref: ./components.yaml#/responses/Unavailable
      x-required-roles:
      - CUSTOMER
      x-readme-fr:
      - FR06.1
      - FR06.2
      - FR06.5
      - FR06.6
      x-readme-use-cases:
      - UC010
      - UC011
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã định danh tripId
        schema:
          type: string
          minLength: 1
        example: trip_001
      - $ref: ./components.yaml#/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/PaymentCreate
    get:
      tags:
      - Payments
      summary: Lịch sử giao dịch của chuyến
      operationId: listTripPayments
      description: Chỉ khách sở hữu/tài xế được phân công; không chứa token hoặc dữ liệu thẻ.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/PaymentPage
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      - DRIVER
      x-readme-fr:
      - FR06.6
      x-readme-use-cases:
      - UC010
      - UC011
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã định danh tripId
        schema:
          type: string
          minLength: 1
        example: trip_001
      - name: page
        in: query
        required: false
        description: page
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: pageSize
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
  /payments/{paymentId}:
    get:
      tags:
      - Payments
      summary: Tra cứu kết quả giao dịch
      operationId: getPayment
      description: Chỉ người tham gia chuyến liên quan; dùng khi thanh toán PENDING hoặc vừa quay về từ checkout.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Payment
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      - DRIVER
      x-readme-fr:
      - FR06.3
      - FR06.6
      x-readme-use-cases:
      - UC011
      parameters:
      - name: paymentId
        in: path
        required: true
        description: Mã định danh paymentId
        schema:
          type: string
          minLength: 1
        example: payment_001
  /payments/{paymentId}/confirm-cash:
    post:
      tags:
      - Payments
      summary: Tài xế xác nhận đã nhận tiền mặt
      operationId: confirmCash
      description: Chỉ tài xế được phân công, giao dịch CASH/PENDING và cước đã chốt. Server cập nhật SUCCEEDED
        và paymentStatus=PAID nguyên tử, gửi biên lai hai bên. Chưa xác nhận giữ PENDING, hệ thống gửi CASH_REMINDER;
        tranh chấp tạo incident. Không nhận số tiền tự khai báo.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Payment
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR06.1
      - FR07.5
      x-readme-use-cases:
      - UC010
      parameters:
      - name: paymentId
        in: path
        required: true
        description: Mã định danh paymentId
        schema:
          type: string
          minLength: 1
        example: payment_001
      - $ref: ./components.yaml#/parameters/IdempotencyKey
  /integrations/payments/callback:
    post:
      tags:
      - Integrations
      summary: Nhận kết quả từ cổng thanh toán mô phỏng
      operationId: paymentCallback
      description: Endpoint server-to-server. Xác minh chữ ký trên raw body và timestamp, chống phát lại bằng eventId.
        Đối chiếu paymentId, providerReference, amount, currency; sai trả 422 PAYMENT_MISMATCH. Callback trùng hợp
        lệ trả 204, không thu/ghi doanh thu lần hai; kết quả mâu thuẫn giữ để đối soát, không hạ SUCCEEDED xuống
        FAILED. Signature algorithm, key rotation và cửa sổ timestamp cần chốt với adapter mô phỏng. Không tin kết
        quả redirect của trình duyệt.
      responses:
        '204':
          description: Xử lý thành công.
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - PAYMENT_PROVIDER
      x-readme-fr:
      - FR06.3
      - FR06.4
      - FR06.6
      - FR07.5
      x-readme-use-cases:
      - UC011
      security:
      - paymentSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/PaymentCallback
      parameters:
      - name: X-Payment-Timestamp
        in: header
        required: true
        schema:
          type: string
          description: Thời gian RFC 3339, lưu UTC.
          format: date-time
          example: '2026-09-07T03:00:00Z'
        description: Thời điểm được bảo vệ bởi chữ ký.
  /rating-options:
    get:
      tags:
      - Ratings
      summary: Nhãn đánh giá và lý do phản ánh
      operationId: getRatingOptions
      description: Danh sách nhãn do server cấu hình.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/RatingOptions
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      x-readme-fr: []
      x-readme-use-cases:
      - UC012
  /trips/{tripId}/rating:
    post:
      tags:
      - Ratings
      summary: Đánh giá tài xế sau thanh toán
      operationId: createRating
      description: Chỉ khách sở hữu; COMPLETED và PAID; mỗi chuyến một đánh giá, trong ratingDeadline (thời hạn
        chưa chốt). Điểm 1–2 yêu cầu negativeReasons và gắn cờ kiểm tra chất lượng. Cập nhật điểm trung bình tài
        xế.
      responses:
        '201':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Rating
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      x-readme-fr: []
      x-readme-use-cases:
      - UC012
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã định danh tripId
        schema:
          type: string
          minLength: 1
        example: trip_001
      - $ref: ./components.yaml#/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/RatingInput
    get:
      tags:
      - Ratings
      summary: Xem đánh giá đã gửi
      operationId: getRating
      description: Khách sở hữu hoặc tài xế của chuyến. Chưa đánh giá trả 404.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Rating
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      - DRIVER
      x-readme-fr: []
      x-readme-use-cases:
      - UC012
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã định danh tripId
        schema:
          type: string
          minLength: 1
        example: trip_001
  /admin/payments:
    get:
      tags:
      - Payments
      summary: Tra cứu giao dịch và đối soát
      operationId: adminListPayments
      description: Quyền payments:read; lọc theo chuyến hoặc trạng thái để xử lý treo thanh toán.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/PaymentPage
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - OPERATOR
      - ADMIN
      x-readme-fr:
      - FR06.6
      - FR08.7
      x-readme-use-cases:
      - UC015
      parameters:
      - name: page
        in: query
        required: false
        description: page
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: pageSize
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
      - name: tripId
        in: query
        required: false
        description: tripId
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: status
        schema:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
          - CANCELLED
  /admin/payments/{paymentId}/refunds:
    get:
      tags:
      - Payments
      summary: Tra cứu kết quả hoàn tiền
      operationId: adminListRefunds
      description: Quyền payments:read; hoàn tiền được tạo qua can thiệp và phê duyệt, không cho gọi API hoàn tiền
        tùy ý.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/RefundPage
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - OPERATOR
      - ADMIN
      x-readme-fr: []
      x-readme-use-cases:
      - UC015
      parameters:
      - name: paymentId
        in: path
        required: true
        description: Mã định danh paymentId
        schema:
          type: string
          minLength: 1
        example: payment_001
      - name: page
        in: query
        required: false
        description: page
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: pageSize
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
