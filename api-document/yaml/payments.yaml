"/trips/{tripId}/payments":
  "post":
    "tags":
      - "Payments"
    "summary": "Khởi tạo thanh toán hoặc thanh toán lại"
    "operationId": "createPayment"
    "description": "Chỉ khách sở hữu; chuyến đã có cước cuối. Lấy số tiền từ hóa đơn server. CASH tạo bản ghi PENDING chờ tài xế xác nhận; BANK_CARD/E_WALLET trả checkoutUrl mô phỏng. Chỉ tạo lần thử mới khi lần trước FAILED/CANCELLED; PENDING phải đối soát trước, PAID từ chối thu lại. Sau thất bại được đổi sang CASH theo chính sách. Timeout cổng giữ PENDING, tự truy vấn đối soát; không coi timeout là thất bại chắc chắn."
    "responses":
      "201":
        "description": "Xử lý thành công."
        "content":
          "application/json":
            "schema":
              "$ref": "./openapi.yaml#/components/schemas/Payment"
      "400":
        "$ref": "./openapi.yaml#/components/responses/BadRequest"
