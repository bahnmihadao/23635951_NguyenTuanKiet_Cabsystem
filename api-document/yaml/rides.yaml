  "get":
    "tags":
      - "Trips"
    "summary": "Theo dõi vị trí và ETA"
    "operationId": "trackTrip"
    "description": "Polling snapshot có thời gian server. Chỉ khách sở hữu/tài xế được phân công. Giữ vị trí cuối khi mất GPS và trả STALE/UNAVAILABLE; không dùng vị trí cũ như dữ liệu trực tiếp. Sau kết thúc ngừng lộ vị trí mới của tài xế, chỉ trả vị trí cuối thuộc chuyến. Chu kỳ polling/ngưỡng stale chưa chốt."
