  /trips/{tripId}/status-transitions:
    post:
      tags:
      - Trips
      summary: Cập nhật tiến trình/đồng bộ khi có mạng
      operationId: transitionTrip
      description: Chỉ tài xế đang được phân công. Trình tự DRIVER_ASSIGNED → ARRIVED → PICKED_UP → IN_PROGRESS
        → COMPLETED. Nút Bắt đầu trong UC008 có thể gửi tuần tự PICKED_UP và IN_PROGRESS để lưu đủ FR04.3/FR04.4.
        ARRIVED kiểm tra GPS và ngưỡng khoảng cách chưa chốt (422 PICKUP_TOO_FAR). COMPLETED tự chốt cước từ dấu
        vết đã xác minh và gửi thông báo. Khi offline lưu request, gửi lại cùng Idempotency-Key; sai expectedVersion
        trả 409 VERSION_CONFLICT, đọc lại chuyến trước khi xử lý. Không chấp nhận thời gian tương lai hoặc trình
        tự sự kiện đảo ngược.
