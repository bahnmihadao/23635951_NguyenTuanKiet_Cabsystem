openapi: 3.0.3
info:
  title: CAB System API - Booking, Drivers & Trips
  version: 0.1.0
servers:
- url: http://localhost:8080/api/v1
  description: Địa chỉ backend dự kiến; thay khi triển khai.
security:
- bearerAuth: []
tags:
- name: Drivers
  description: Hồ sơ, xe, sẵn sàng, GPS
- name: Booking
  description: Địa chỉ, lộ trình, loại xe, báo giá
- name: Trips
  description: Đặt và theo dõi chuyến
- name: Dispatch
  description: Nhận/từ chối lời mời
paths:
  /drivers/me/profile:
    get:
      tags:
      - Drivers
      summary: Xem hồ sơ tài xế
      operationId: getDriverProfile
      description: Chỉ tài xế sở hữu. Thay đổi giấy tờ đưa hồ sơ về PENDING để duyệt lại. Dữ liệu nhạy cảm không
        xuất hiện trong thông tin tài xế công khai.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/DriverProfile
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR01.4
      x-readme-use-cases: []
    put:
      tags:
      - Drivers
      summary: Cập nhật hồ sơ tài xế
      operationId: putDriverProfile
      description: Chỉ tài xế sở hữu. Thay đổi giấy tờ đưa hồ sơ về PENDING để duyệt lại. Dữ liệu nhạy cảm không
        xuất hiện trong thông tin tài xế công khai.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/DriverProfile
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR01.4
      x-readme-use-cases: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/DriverProfileInput
  /drivers/me/vehicle:
    get:
      tags:
      - Drivers
      summary: Xem phương tiện của tôi
      operationId: getDriverVehicle
      description: Thiết kế mỗi tài xế một xe hoạt động. PUT tạo hoặc thay thế thông tin, biển số duy nhất; đổi
        xe/giấy tờ cần duyệt lại. Không đổi phương tiện khi đang thực hiện chuyến.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Vehicle
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR01.5
      x-readme-use-cases: []
    put:
      tags:
      - Drivers
      summary: Đăng ký/cập nhật phương tiện
      operationId: putDriverVehicle
      description: Thiết kế mỗi tài xế một xe hoạt động. PUT tạo hoặc thay thế thông tin, biển số duy nhất; đổi
        xe/giấy tờ cần duyệt lại. Không đổi phương tiện khi đang thực hiện chuyến.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Vehicle
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR01.5
      x-readme-use-cases: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/VehicleInput
  /drivers/me/availability:
    put:
      tags:
      - Drivers
      summary: Bật/tắt nhận cuốc
      operationId: setAvailability
      description: Chỉ hồ sơ và xe APPROVED mới bật AVAILABLE. BUSY do server quản lý; đang phục vụ chuyến không
        được tự giải phóng trạng thái.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Availability
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR03.1
      - FR08.6
      x-readme-use-cases: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/AvailabilityInput
  /drivers/me/locations:
    post:
      tags:
      - Drivers
      summary: Cập nhật vị trí GPS
      operationId: recordLocation
      description: Lưu dấu vết theo recordedAt/sequence; mẫu cũ không ghi đè vị trí mới nhất. Server gắn vị trí
        vào chuyến đang được phân công. Không nhận driverId tùy ý.
      responses:
        '204':
          description: Xử lý thành công.
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - DRIVER
      x-readme-fr:
      - FR03.1
      - FR03.2
      - FR04.7
      x-readme-use-cases: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/Location
  /vehicle-types:
    get:
      tags:
      - Booking
      summary: Danh sách loại xe
      operationId: listVehicleTypes
      description: Ba loại xe của UC003; khả dụng theo khu vực.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/VehicleServicePage
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr:
      - FR02.3
      x-readme-use-cases:
      - UC003
      parameters:
      - name: page
        in: query
        required: false
        description: page
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: pageSize
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
      - name: regionId
        in: query
        required: false
        description: regionId
        schema:
          type: string
  /regions:
    get:
      tags:
      - Booking
      summary: Danh mục khu vực
      operationId: listRegions
      description: Dùng chọn khu vực phục vụ và bộ lọc báo cáo.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/RegionPage
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr: []
      x-readme-use-cases:
      - UC016
      parameters:
      - name: page
        in: query
        required: false
        description: page
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: pageSize
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
  /places:
    get:
      tags:
      - Booking
      summary: Tìm địa chỉ/điểm đón và đến
      operationId: searchPlaces
      description: Adapter bản đồ cơ bản hoặc mô phỏng. Không tích hợp định tuyến tránh kẹt xe có bản quyền.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/PointPage
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
        '503':
          $ref: ./components.yaml#/responses/Unavailable
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr:
      - FR02.1
      - FR02.2
      x-readme-use-cases:
      - UC003
      parameters:
      - name: page
        in: query
        required: false
        description: page
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: pageSize
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
      - name: query
        in: query
        required: true
        description: query
        schema:
          type: string
          minLength: 1
  /routes:
    post:
      tags:
      - Booking
      summary: Tính lộ trình dự kiến
      operationId: calculateRoute
      description: Trả danh sách tọa độ để vẽ đường, khoảng cách và thời gian; địa chỉ không xác định trả 422 LOCATION_UNRESOLVABLE.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Route
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
        '503':
          $ref: ./components.yaml#/responses/Unavailable
      x-required-roles:
      - AUTHENTICATED
      x-readme-fr:
      - FR02.1
      - FR02.2
      x-readme-use-cases:
      - UC003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/RouteRequest
  /fare-estimates:
    post:
      tags:
      - Booking
      summary: Ước tính cước trước khi đặt
      operationId: estimateFare
      description: Bảng giá theo loại xe và quãng đường; công thức chưa chốt. Không dùng dynamic pricing. Báo giá
        gắn chủ sở hữu và bộ thông tin chuyến; thời hạn trả qua expiresAt.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/FareEstimate
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
        '503':
          $ref: ./components.yaml#/responses/Unavailable
      x-required-roles:
      - CUSTOMER
      x-readme-fr:
      - FR05.2
      x-readme-use-cases:
      - UC003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/FareEstimateRequest
  /trips:
    post:
      tags:
      - Trips
      summary: Tạo yêu cầu đặt xe
      operationId: createTrip
      description: 'Kiểm tra estimateId thuộc khách, chưa hết hạn và khớp điểm đón/đến/loại xe. Tạo SEARCHING và
        UNPAID; tự động chọn tài xế AVAILABLE phù hợp, ưu tiên khoảng cách/hiệu quả, gửi offer. 201 chỉ xác nhận
        tạo yêu cầu. Không tìm được tài xế: chuyển CANCELLED với cancelCode=NO_DRIVER_AVAILABLE, cancelledBy=SYSTEM
        và thông báo. Thời gian và trọng số chưa chốt.'
      responses:
        '201':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Trip
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '409':
          $ref: ./components.yaml#/responses/Conflict
        '422':
          $ref: ./components.yaml#/responses/Unprocessable
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      x-readme-fr:
      - FR02.4
      - FR03.1
      - FR03.2
      - FR03.3
      - FR03.6
      - FR03.7
      - FR07.1
      - FR07.6
      x-readme-use-cases:
      - UC003
      - UC004
      parameters:
      - $ref: ./components.yaml#/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/schemas/TripCreate
    get:
      tags:
      - Trips
      summary: Lịch sử chuyến của tôi
      operationId: listMyTrips
      description: Khách chỉ thấy chuyến của mình; tài xế chỉ thấy chuyến đã được phân công. Không cho client truyền
        customerId để xem người khác.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/TripPage
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      - DRIVER
      x-readme-fr:
      - FR02.5
      x-readme-use-cases:
      - UC009
      - UC012
      parameters:
      - name: page
        in: query
        required: false
        description: page
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: pageSize
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        required: false
        description: status
        schema:
          $ref: ./components.yaml#/schemas/TripStatus
  /trips/{tripId}:
    get:
      tags:
      - Trips
      summary: Chi tiết và trạng thái yêu cầu
      operationId: getTrip
      description: Chỉ khách sở hữu hoặc tài xế được phân công. Thanh toán tách paymentStatus; COMPLETED không đồng
        nghĩa PAID.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Trip
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      - DRIVER
      x-readme-fr:
      - FR02.5
      - FR04.6
      x-readme-use-cases:
      - UC009
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã định danh tripId
        schema:
          type: string
          minLength: 1
        example: trip_001
  /trips/{tripId}/tracking:
    get:
      tags:
      - Trips
      summary: Theo dõi vị trí và ETA
      operationId: trackTrip
      description: Polling snapshot có thời gian server. Chỉ khách sở hữu/tài xế được phân công. Giữ vị trí cuối
        khi mất GPS và trả STALE/UNAVAILABLE; không dùng vị trí cũ như dữ liệu trực tiếp. Sau kết thúc ngừng lộ
        vị trí mới của tài xế, chỉ trả vị trí cuối thuộc chuyến. Chu kỳ polling/ngưỡng stale chưa chốt.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/Tracking
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      - DRIVER
      x-readme-fr:
      - FR04.6
      - FR04.7
      x-readme-use-cases:
      - UC009
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã định danh tripId
        schema:
          type: string
          minLength: 1
        example: trip_001
  /trips/{tripId}/events:
    get:
      tags:
      - Trips
      summary: Lịch sử trạng thái chuyến
      operationId: listTripEvents
      description: Chỉ người tham gia chuyến; sự kiện sắp xếp theo thời gian, không chứa audit nội bộ.
      responses:
        '200':
          description: Xử lý thành công.
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/schemas/TripEventPage
        '400':
          $ref: ./components.yaml#/responses/BadRequest
        '401':
          $ref: ./components.yaml#/responses/Unauthorized
        '403':
          $ref: ./components.yaml#/responses/Forbidden
        '404':
          $ref: ./components.yaml#/responses/NotFound
        '429':
          $ref: ./components.yaml#/responses/TooManyRequests
        '500':
          $ref: ./components.yaml#/responses/ServerError
      x-required-roles:
      - CUSTOMER
      - DRIVER
      x-readme-fr:
      - FR04.6
      x-readme-use-cases:
      - UC009
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã định danh tripId
        schema:
          type: string
          minLength: 1
        example: trip_001
      - name: page
        in: query
        required: false
        description: page
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        description: pageSize
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
  /drivers/me/offers:
    get:
      tags:
      - Dispatch
      summary: Danh sách lời mời nhận chuyến
      operationId: listOffers
