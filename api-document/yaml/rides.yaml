      summary: Hủy chuyến/hủy tìm kiếm/khách vắng mặt
      operationId: cancelTrip
      description: Chỉ khách sở hữu hoặc tài xế được phân công. Thiết kế cho tự hủy ở SEARCHING, DRIVER_ASSIGNED,
        ARRIVED; đang chở khách cần vận hành xử lý sự cố. customerNoShow=true chỉ tài xế, trạng thái ARRIVED và
        hết thời gian chờ cấu hình. Ghi cancelCode/cancelledBy, thu hồi offer, giải phóng tài xế, gửi thông báo.
        Phí/chế tài hủy chưa chốt; không mặc định miễn phí.
      responses:
